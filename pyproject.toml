[project]
name = "guesstimate"
version = "0.1.0"
description = "A Bulls and Cows solver, game, and research toy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Akif Celepcikay" },  # original 2021 version, preserved in legacy/
    { name = "Hakan Celepcikay" }, # 2026 rebuild
]
dependencies = []

[project.urls]
Repository = "https://github.com/Hakantx/Guesstimate"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guesstimate"]

[tool.ruff]
line-length = 88
target-version = "py312"
# legacy/ is the preserved high school version. It is never linted and never
# edited -- it exists to be read, not maintained.
#
# Markdown is excluded because ruff formats Python code blocks inside it, and
# the snippets in ROADMAP.md are illustrative spec prose, not source. Letting
# the formatter own them means a spec edit can fail CI on whitespace.
extend-exclude = ["legacy", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8 naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ANN",  # require type annotations (CLAUDE.md: type hints everywhere)
    "D",    # docstrings on public API
]
ignore = [
    "D105",  # magic methods: __str__ on Feedback does not need prose
    "D107",  # __init__ docstring; the class docstring covers it
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
# Tests are self-describing; docstrings and annotations on them are noise.
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["^legacy/"]

[[tool.mypy.overrides]]
module = "legacy.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Same call as the ruff per-file-ignores above: a `-> None` on every test and a
# type on every Hypothesis-supplied argument is noise, and the engine's own
# annotations are what strict mode is there to protect. Bodies are still fully
# checked -- this drops the signature requirement, not the type checking.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    # Run by default -- these are correctness tests and CI must not skip them.
    # The marker exists so a tight local edit loop can use `make test-fast`.
    "slow: brute-forces a mid-size candidate space; about a second each",
]
